<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efe4c9"/><circle cx="3" cy="4" r="1.3" fill="#cdb98c"/><circle cx="9" cy="9" r="1" fill="#cdb98c"/></pattern>
  </defs>
  <rect width="180" height="180" fill="#f6f7f4"/>
  <!-- soil -->
  <rect x="0" y="34" width="180" height="70" fill="url(#dots)"/>
  <!-- rock with irregular top -->
  <path d="M0 104 C30 98 55 110 90 104 S150 99 180 105 V180 H0 Z" fill="#cfc9bd"/>
  <path d="M0 104 C30 98 55 110 90 104 S150 99 180 105" fill="none" stroke="#8f887a" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M12 132 H58 M110 128 H170 M30 156 H88 M126 158 H168 M58 132 L54 156 M110 128 L116 158" stroke="#a9a293" stroke-width="2" fill="none"/>
  <!-- ground line -->
  <line x1="0" y1="34" x2="180" y2="34" stroke="#1d2433" stroke-width="3"/>
  <!-- cased shaft -->
  <rect x="70" y="20" width="40" height="88" fill="#d9dce0" stroke="#2f5aa8" stroke-width="5"/>
  <!-- rock socket -->
  <rect x="74" y="108" width="32" height="50" fill="#d9dce0" stroke="#1d2433" stroke-width="2"/>
  <!-- steel core -->
  <rect x="80" y="20" width="4" height="134" fill="#1d2433"/>
  <rect x="96" y="20" width="4" height="134" fill="#1d2433"/>
  <rect x="88.5" y="20" width="3" height="134" fill="#1d2433" opacity=".55"/>
  <!-- load arrow -->
  <path d="M90 2 V14" stroke="#b23a2b" stroke-width="5"/><path d="M82 10 L90 19 L98 10 Z" fill="#b23a2b"/>
</svg>
